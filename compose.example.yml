    #   ports:
    #     - "7700:7700"
    #   volumes:
    #     - saas_meilidata:/meili_data
    #   networks:
    #     - saas_network

    # ==============================================================================
    # pgAdmin - PostgreSQL Web Admin UI (Optional / Commented)
    # ==============================================================================
    # pgadmin:
