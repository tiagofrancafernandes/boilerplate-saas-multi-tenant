name: boilerplate-saas

services:
    # ==============================================================================
    # Primary PostgreSQL Database (Multi-Tenant Schema Manager)
    # ==============================================================================
    postgres:
        image: postgres:16-alpine
        container_name: saas_postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-dev_boilerplate_saas}
            POSTGRES_USER: ${DB_USERNAME:-postgres}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
            PGDATA: /var/lib/postgresql/data/pgdata
        ports:
            - '${DB_PORT:-1010}:5432'
        volumes:
            - saas_pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d dev_boilerplate_saas']
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - saas_network

    # ==============================================================================
    # Redis Cache, Sessions & Queues
    # ==============================================================================
    redis:
        image: redis:7-alpine
        container_name: saas_redis
        restart: unless-stopped
        ports:
            - '${REDIS_PORT:-1020}:6379'
        volumes:
            - saas_redisdata:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - saas_network

    # ==============================================================================
    # MinIO (S3 Compatible Object Storage)
    # ==============================================================================
    minio:
        image: minio/minio:latest
        container_name: saas_minio
        restart: unless-stopped
        command: server /data --console-address ":9002"
        environment:
            MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
            MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
        ports:
            - '9001:9000' # S3 API endpoint
            - '9002:9002' # MinIO Web Console
        volumes:
            - saas_miniodata:/data
        networks:
            - saas_network

    # Helper service to initialize the default S3 bucket
    minio-init-bucket:
        image: minio/mc:latest
        container_name: saas_minio_init
        depends_on:
            - minio
        entrypoint: >
            /bin/sh -c "
            until (/usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin); do
              echo 'Waiting for MinIO storage to be ready...';
              sleep 2;
            done;
            /usr/bin/mc mb --ignore-existing myminio/generic;
            /usr/bin/mc anonymous set download myminio/generic;
            echo 'Default bucket generic initialized.';
            exit 0;
            "
        networks:
            - saas_network

    # ==============================================================================
    # Mailpit - Local SMTP Server & Webmail (Commented by default)
    # ==============================================================================
    # mailpit:
    #   image: axllent/mailpit:latest
