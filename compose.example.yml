    # ==============================================================================
    # Meilisearch - Full-Text Search Engine (Optional / Commented)
    # ==============================================================================
    # meilisearch:
    #   image: getmeili/meilisearch:latest
    #   container_name: saas_meilisearch
    #   restart: unless-stopped
    #   environment:
    #     MEILI_NO_ANALYTICS: "true"
